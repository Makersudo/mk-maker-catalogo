<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MK Maker - Makeup & Beauty, catalogo online de beleza." />
    <meta name="theme-color" content="#c98f86" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MK Maker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/assets/mk-maker-logo-symbol-transparent.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/mk-maker-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MK Maker | Makeup & Beauty</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #ffffff;
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      #app-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 10px solid #fbf4f3;
        pointer-events: none;
      }

      .app-splash--hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none;
      }

      .app-splash__content {
        position: relative;
        display: flex;
        width: min(88vw, 440px);
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }

      .app-splash__logo {
        width: min(72vw, 340px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 20px 34px rgba(106, 68, 63, 0.14));
        animation: app-splash-logo 1.8s ease-in-out infinite;
      }

      .app-splash__track {
        position: relative;
        width: min(54vw, 220px);
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #f2e3e0;
      }

      .app-splash__progress {
        position: absolute;
        inset-block: 0;
        left: -42%;
        width: 42%;
        border-radius: inherit;
        background: #c98f86;
        animation: app-splash-progress 1.2s ease-in-out infinite;
      }

      @keyframes app-splash-logo {
        0%, 100% { transform: translateY(0); opacity: 0.92; }
        50% { transform: translateY(-4px); opacity: 1; }
      }

      @keyframes app-splash-progress {
        0% { transform: translateX(0); }
        100% { transform: translateX(340%); }
      }

      @media (max-width: 640px) {
        #app-splash::before {
          border-width: 6px;
        }

        .app-splash__content {
          gap: 20px;
        }

        .app-splash__logo {
          width: min(76vw, 250px);
        }

        .app-splash__track {
          width: min(48vw, 170px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo,
        .app-splash__progress {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Carregando catalogo MK Maker">
      <div class="app-splash__content">
        <img
          class="app-splash__logo"
          src="/assets/mk-maker-logo-symbol-transparent.png"
          alt="MK Maker"
        />
        <div class="app-splash__track" aria-hidden="true">
          <span class="app-splash__progress"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
